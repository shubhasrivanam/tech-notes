# Site settings
title: Shubha's Tech Notes
description: Daily notes on frequently used and heard tech things
baseurl: "/tech-notes" 
url: "https://shubhasrivanam.github.io"

# Author info (optional, but nice for footer/about)
author: Shubhasri Vanam
github_username: shubhasrivanam

# Theme
theme: minima

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/

# Minima theme options
minima:
  skin: auto              # or 'classic', 'auto', 'solarized' — pick your vibe
  social_links:
    - platform: github
      user_url: "https://github.com/shubhasrivanam"
    - platform: linkedin
      user_url: "https://linkedin.com/in/shubhasrivanam"

# Pagination (shows N posts per page instead of all at once)
paginate: 10
paginate_path: "/page:num/"

# Exclude from processing (keeps build clean)
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

# Defaults (auto-applies to every post, saves you retyping in front matter)
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"